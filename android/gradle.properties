# Heap de Gradle: 8G es demasiado en un equipo de ~12 GB si además corren
# Android Studio y el emulador. Con 3G esta app compila igual (verificado).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# El proyecto vive en una ruta con "ñ" (SeñasGo): permite que AGP compile.
# Referencia oficial: http://b.android.com/95744
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# El JDK del sistema es 25 y algunos plugins (tflite_flutter) dejan Java en 1.8.
# Se degrada la validación a warning para no bloquear el build.
# Documentación: https://kotl.in/gradle/jvm/target-validation
kotlin.jvm.target.validation.mode=warning

